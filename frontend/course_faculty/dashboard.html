<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Course Faculty Dashboard</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/style.css">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>


<body>

<div id="chrome"></div>

<script src="../assets/js/common.js"></script>


<script>

window.API_BASE = '../../backend';

renderChrome('course_faculty');

let myTimetable = [];

let selectedTimetable = null;

window.currentStudents = [];



/* =========================================================
   LOAD DASHBOARD
========================================================= */

(async () => {

    const me = await requirePageRole('course_faculty');

    if (!me) return;

    try {

        const d = await apiJson(
            API_BASE + '/course_faculty/dashboard.php'
        );

        const t = await apiJson(
            API_BASE + '/course_faculty/timetable.php'
        );

        myTimetable = t.data || [];


        document.getElementById('page-content').innerHTML = `

            <div class="page-head">

                <h3>
                    Course Faculty Dashboard
                </h3>

                <p>
                    Welcome,
                    ${escapeHtml(d.faculty.full_name)}
                    •
                    ${escapeHtml(d.faculty.designation || 'Course Faculty')}
                    •
                    ${escapeHtml(d.faculty.department)}
                </p>

            </div>


            <div class="container-fluid">


                <!-- =====================================================
                     MY ASSIGNED COURSES
                ====================================================== -->

                <div class="card page-card mb-4">

                    <div class="card-header d-flex justify-content-between">

                        <b>
                            <i class="fa-solid fa-book me-2"></i>
                            My Assigned Courses
                        </b>

                        <span class="text-muted small">
                            ${d.assignments.length} assignment(s)
                        </span>

                    </div>


                    <div class="table-responsive">

                        <table class="table table-hover mb-0">

                            <thead>

                                <tr>

                                    <th>#</th>
                                    <th>Subject / Course</th>
                                    <th>Class</th>
                                    <th>Batch</th>
                                    <th>Semester</th>
                                    <th>Academic Year</th>
                                    <th>Section</th>
                                    <th>Assigned By</th>

                                </tr>

                            </thead>


                            <tbody>

                                ${
                                    d.assignments.length

                                    ?

                                    d.assignments.map((r,i) => `

                                        <tr>

                                            <td>${i+1}</td>

                                            <td>
                                                <b>
                                                    ${escapeHtml(r.course_name)}
                                                </b>
                                            </td>

                                            <td>
                                                ${escapeHtml(r.department)}
                                                -
                                                ${escapeHtml(r.section)}
                                            </td>

                                            <td>
                                                ${escapeHtml(r.batch)}
                                            </td>

                                            <td>
                                                ${escapeHtml(r.semester)}
                                            </td>

                                            <td>
                                                ${escapeHtml(r.academic_year)}
                                            </td>

                                            <td>
                                                ${escapeHtml(r.section)}
                                            </td>

                                            <td>

                                                ${escapeHtml(r.advisor_name)}

                                                <br>

                                                <small class="text-muted">

                                                    ${escapeHtml(
                                                        r.advisor_designation || 'Advisor'
                                                    )}

                                                </small>

                                            </td>

                                        </tr>

                                    `).join('')

                                    :

                                    `
                                    <tr>

                                        <td colspan="8"
                                            class="text-center text-muted py-5">

                                            No course has been assigned
                                            to you yet.

                                        </td>

                                    </tr>
                                    `
                                }

                            </tbody>

                        </table>

                    </div>

                </div>



                <!-- =====================================================
                     WEEKLY TIMETABLE
                ====================================================== -->

                <div class="card page-card mb-4">

                    <div class="card-header">

                        <b>
                            <i class="fa-solid fa-calendar-days me-2"></i>
                            My Weekly Timetable
                        </b>

                    </div>


                    <div class="table-responsive">

                        <table class="table table-bordered text-center align-middle mb-0">

                            <thead>

                                <tr>

                                    <th>Day</th>

                                    ${[1,2,3,4,5,6,7]
                                        .map(p => `<th>Period ${p}</th>`)
                                        .join('')
                                    }

                                </tr>

                            </thead>


                            <tbody>

                                ${createTimetableRows()}

                            </tbody>

                        </table>

                    </div>

                </div>



                <!-- =====================================================
                     ATTENDANCE AREA
                ====================================================== -->

                <div id="attendance-area"></div>


            </div>
        `;


    } catch (e) {

        Swal.fire(
            'Error',
            e.message,
            'error'
        );

    }

})();



/* =========================================================
   CREATE WEEKLY TIMETABLE
========================================================= */

function createTimetableRows() {

    const days = [
        'Monday',
        'Tuesday',
        'Wednesday',
        'Thursday',
        'Friday',
        'Saturday'
    ];


    return days.map(day => {

        return `

            <tr>

                <th>
                    ${day}
                </th>


                ${[1,2,3,4,5,6,7]
                    .map(period => {

                        const item = myTimetable.find(
                            x =>
                                x.day === day &&
                                Number(x.period) === period
                        );


                        if (!item) {

                            return `

                                <td class="text-muted">
                                    Free
                                </td>

                            `;

                        }


                        return `

                            <td>

                                <button
                                    class="btn btn-sm btn-outline-primary w-100"
                                    onclick="openAttendance(${item.id})"
                                >

                                    <b>
                                        ${escapeHtml(item.course_name)}
                                    </b>

                                    <br>

                                    <small>

                                        ${escapeHtml(item.department)}
                                        -
                                        ${escapeHtml(item.section)}

                                    </small>

                                </button>

                            </td>

                        `;

                    })
                    .join('')
                }

            </tr>

        `;

    }).join('');

}



/* =========================================================
   OPEN ATTENDANCE
========================================================= */

async function openAttendance(timetableId) {

    selectedTimetable = myTimetable.find(
        item => Number(item.id) === Number(timetableId)
    );


    if (!selectedTimetable) {

        Swal.fire(
            'Error',
            'Timetable details not found.',
            'error'
        );

        return;

    }


    const today = new Date().toISOString().split('T')[0];


    await loadAttendanceStudents(
        timetableId,
        today
    );

}



/* =========================================================
   LOAD STUDENTS FOR ATTENDANCE
========================================================= */

async function loadAttendanceStudents(
    timetableId,
    attendanceDate
) {

    try {

        const data = await apiJson(
            `${API_BASE}/course_faculty/students.php?timetable_id=${timetableId}&attendance_date=${attendanceDate}`
        );


        if (!data.success) {

            Swal.fire(
                'Error',
                data.message || 'Could not load students.',
                'error'
            );

            return;

        }


        window.currentStudents = data.students || [];


        renderAttendance(data);


    } catch (error) {

        console.error(error);


        Swal.fire(
            'Error',
            'Could not load students.',
            'error'
        );

    }

}



/* =========================================================
   RENDER ATTENDANCE
========================================================= */

function renderAttendance(data) {

    const container =
        document.getElementById('attendance-area');


    if (!container) {

        console.error(
            'attendance-area not found.'
        );

        return;

    }


    const students =
        data.students || [];


    const today =
        data.attendance_date ||
        new Date().toISOString().split('T')[0];


    let html = `

        <div class="card page-card mb-4">

            <div class="card-header">

                <b>

                    <i class="fa-solid fa-user-check me-2"></i>

                    Attendance

                </b>

            </div>


            <div class="card-body">


                <div class="row mb-4">

                    <div class="col-md-6">

                        <h5>

                            ${escapeHtml(
                                selectedTimetable.course_name
                            )}

                        </h5>

                        <div class="text-muted">

                            ${escapeHtml(
                                selectedTimetable.department
                            )}

                            -

                            Section
                            ${escapeHtml(
                                selectedTimetable.section
                            )}

                            • Period
                            ${selectedTimetable.period}

                        </div>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">

                            <b>
                                Attendance Date
                            </b>

                        </label>


                        <input
                            type="date"
                            class="form-control"
                            id="attendanceDate"
                            value="${today}"
                            onchange="changeAttendanceDate()"
                        >

                    </div>

                </div>



                <div class="mb-3">

                    <button
                        type="button"
                        class="btn btn-success btn-sm me-2"
                        onclick="markAll('Present')"
                    >

                        <i class="fa-solid fa-check me-1"></i>

                        Mark All Present

                    </button>


                    <button
                        type="button"
                        class="btn btn-danger btn-sm"
                        onclick="markAll('Absent')"
                    >

                        <i class="fa-solid fa-xmark me-1"></i>

                        Mark All Absent

                    </button>

                </div>



                <div class="table-responsive">

                    <table class="table table-bordered align-middle">

                        <thead>

                            <tr>

                                <th style="width:70px">
                                    #
                                </th>

                                <th>
                                    Register No
                                </th>

                                <th>
                                    Student Name
                                </th>

                                <th class="text-center">
                                    Attendance
                                </th>

                            </tr>

                        </thead>


                        <tbody>

    `;


    if (students.length === 0) {

        html += `

            <tr>

                <td
                    colspan="4"
                    class="text-center text-muted py-4"
                >

                    No students found for this section.

                </td>

            </tr>

        `;

    } else {


        students.forEach((student, index) => {


            const applicationType =
                student.attendance_type;


            html += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>


                    <td>

                        ${escapeHtml(
                            student.reg_no ||
                            student.username ||
                            ''
                        )}

                    </td>


                    <td>

                        <b>

                            ${escapeHtml(
                                student.full_name
                            )}

                        </b>

                    </td>


                    <td class="text-center">
            `;


            /* =====================================================
               LEAVE
            ====================================================== */

            if (applicationType === 'Leave') {

                html += `

                    <span
                        class="badge bg-warning text-dark px-3 py-2"
                    >

                        <i class="fa-solid fa-calendar-xmark me-1"></i>

                        LEAVE

                    </span>

                `;

            }


            /* =====================================================
               OD
            ====================================================== */

            else if (applicationType === 'OD') {

                html += `

                    <span
                        class="badge bg-info text-dark px-3 py-2"
                    >

                        <i class="fa-solid fa-building-columns me-1"></i>

                        OD

                    </span>

                `;

            }


            /* =====================================================
               NORMAL ATTENDANCE
            ====================================================== */

            else {

                html += `

                    <label class="me-3">

                        <input
                            type="radio"
                            name="attendance_${student.id}"
                            value="Present"
                            checked
                        >

                        <span class="text-success fw-semibold">

                            Present

                        </span>

                    </label>


                    <label>

                        <input
                            type="radio"
                            name="attendance_${student.id}"
                            value="Absent"
                        >

                        <span class="text-danger fw-semibold">

                            Absent

                        </span>

                    </label>

                `;

            }


            html += `

                    </td>

                </tr>

            `;

        });

    }


    html += `

                        </tbody>

                    </table>

                </div>


                <div class="mt-3">

                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="saveAttendance()"
                    >

                        <i class="fa-solid fa-floppy-disk me-1"></i>

                        Save Attendance

                    </button>

                </div>


            </div>

        </div>

    `;


    container.innerHTML = html;

}



/* =========================================================
   CHANGE ATTENDANCE DATE
========================================================= */

async function changeAttendanceDate() {

    if (!selectedTimetable) {
        return;
    }


    const dateInput =
        document.getElementById('attendanceDate');


    if (!dateInput || !dateInput.value) {
        return;
    }


    await loadAttendanceStudents(
        selectedTimetable.id,
        dateInput.value
    );

}



/* =========================================================
   MARK ALL
========================================================= */

function markAll(status) {

    if (!window.currentStudents) {
        return;
    }


    window.currentStudents.forEach(student => {


        /*
        ---------------------------------------------------------
        Leave / OD students have no radio buttons.
        So querySelector will return null and nothing happens.
        ---------------------------------------------------------
        */

        const radio =
            document.querySelector(
                `input[name="attendance_${student.id}"][value="${status}"]`
            );


        if (radio) {

            radio.checked = true;

        }

    });

}



/* =========================================================
   SAVE ATTENDANCE
========================================================= */

async function saveAttendance() {

    if (
        !selectedTimetable ||
        !window.currentStudents
    ) {

        Swal.fire(
            'Error',
            'Please select a timetable period first.',
            'error'
        );

        return;

    }


    const dateInput =
        document.getElementById('attendanceDate');


    if (
        !dateInput ||
        !dateInput.value
    ) {

        Swal.fire(
            'Warning',
            'Please select an attendance date.',
            'warning'
        );

        return;

    }


    const attendance = {};


    let normalStudentCount = 0;


    window.currentStudents.forEach(student => {


        /*
        ---------------------------------------------------------
        Leave / OD students should NOT be included
        in attendance object.
        ---------------------------------------------------------
        */

        if (
            student.attendance_type === 'Leave' ||
            student.attendance_type === 'OD'
        ) {

            return;

        }


        normalStudentCount++;


        const selected =
            document.querySelector(
                `input[name="attendance_${student.id}"]:checked`
            );


        if (selected) {

            attendance[student.id] =
                selected.value;

        }

    });


    /*
    ---------------------------------------------------------
    Check only NORMAL students.
    Leave / OD students are automatically excluded.
    ---------------------------------------------------------
    */

    if (
        Object.keys(attendance).length !==
        normalStudentCount
    ) {

        Swal.fire(
            'Warning',
            'Please mark attendance for all normal students.',
            'warning'
        );

        return;

    }


    try {

        const response = await apiJson(

            API_BASE +
            '/course_faculty/attendance.php',

            {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },


                body: JSON.stringify({

                    timetable_id:
                        selectedTimetable.id,


                    attendance_date:
                        dateInput.value,


                    attendance:
                        attendance

                })

            }

        );


        if (!response.success) {

            Swal.fire(
                'Error',
                response.message,
                'error'
            );

            return;

        }


        Swal.fire(
            'Success',
            'Attendance saved successfully.',
            'success'
        );


    } catch (e) {

        console.error(e);


        Swal.fire(
            'Error',
            e.message,
            'error'
        );

    }

}

</script>

</body>

</html>
